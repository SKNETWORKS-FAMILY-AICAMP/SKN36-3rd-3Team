name: 보건복지부 PDF 월간 점검

on:
  schedule:
    - cron: '10 9 1 * *'
      timezone: Asia/Seoul
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-mohw-pdf-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: 점검 코드 가져오기
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 이전 점검 상태 가져오기
        uses: actions/checkout@v7
        with:
          ref: refs/heads/pdf-check-results
          path: pdf-check-results

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: 점검용 패키지 설치
        run: python -m pip install -r scripts/pdf-check-requirements.txt

      - name: PDF 점검
        id: check
        run: |
          status=0
          python scripts/check_pdfs.py \
            --state-in pdf-check-results/state.json \
            --state-out pdf-check-output/state.json \
            --report pdf-check-output/report.json \
            --summary "$GITHUB_STEP_SUMMARY" || status=$?

          case "$status" in
            0|2) ;;
            *) exit "$status" ;;
          esac

          python -m json.tool pdf-check-output/state.json > /dev/null
          python -m json.tool pdf-check-output/report.json > /dev/null
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 결과 브랜치에 기록
        working-directory: pdf-check-results
        run: |
          mkdir -p runs
          report="runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          cp ../pdf-check-output/state.json state.json
          cp ../pdf-check-output/report.json "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.json "$report"
          git commit -m "Record PDF check $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin HEAD:refs/heads/pdf-check-results

      - name: 점검 보고서 업로드
        if: ${{ !cancelled() && steps.check.outputs.status != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pdf-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: pdf-check-output/report.json
          if-no-files-found: error

      - name: 출처별 실패가 있으면 실행 결과에 표시
        if: steps.check.outputs.status == '2'
        run: exit 1
